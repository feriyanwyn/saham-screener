[project]
name = "ai-stock-analyzer"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "SQLAlchemy>=2.0.30",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
]

[tool.vercel]
entrypoint = "app.api.vercel_app:app"
